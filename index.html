<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DistriLac</title><link rel="stylesheet" href="styles.css"></head><body><header><h1>DistriLac</h1><nav><button data-tab="clientes">Clientes</button><button data-tab="productos">Productos</button><button data-tab="pedidos">Pedidos</button></nav></header><main><section id="clientes" class="tab active"><h2>Clientes</h2><div class="grid"><form id="clienteForm"><input id="clienteNombre" placeholder="Nombre del cliente" required><input id="clienteZona" placeholder="Zona"><input id="clienteTelefono" placeholder="Teléfono"><button>Agregar cliente</button></form><div><input id="buscarCliente" placeholder="Buscar cliente"><div id="listaClientes"></div></div></div></section><section id="productos" class="tab"><h2>Productos</h2><div class="grid"><form id="productoForm"><input id="productoNombre" placeholder="Producto" required><select id="productoProveedor"><option>Mauro / Nonna Pia</option><option>Casuarinas</option><option>Metti</option><option>FM</option></select><input id="productoPrecio" type="number" min="0" step="0.01" placeholder="Precio"><button>Agregar producto</button></form><div><input id="buscarProducto" placeholder="Buscar producto"><div id="listaProductos"></div></div></div></section><section id="pedidos" class="tab"><h2>Nuevo pedido</h2><div class="pedido-layout"><div><label>Cliente</label><input id="pedidoClienteBuscar" placeholder="Buscar cliente"><div id="pedidoClientes"></div></div><div><label>Productos</label><input id="pedidoProductoBuscar" placeholder="Buscar producto"><div id="pedidoProductos"></div></div><aside><h3>Pedido</h3><div id="pedidoSeleccion"></div><label>Deuda anterior</label><input id="deudaAnterior" type="number" min="0" value="0"><button id="guardarPedido">Guardar pedido</button></aside></div><h3>Pedidos guardados</h3><div id="listaPedidos"></div></section></main><script src="app.js"></script></body></html>
